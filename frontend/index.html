<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Sistema Corporativo</h1>

        <input type="text" id="nome" placeholder="Nome">

        <input type="text" id="setor" placeholder="Setor">

        <textarea
            id="solicitacao"
            placeholder="Digite a solicitação"
        ></textarea>

        <button onclick="cadastrarChamado()">
            Cadastrar
        </button>

        <h2>Chamados</h2>

        <div id="lista"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
